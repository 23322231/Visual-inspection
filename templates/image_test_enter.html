<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/eye_echart.css" />
    <title>調整視力測驗圖片大小</title>
    <style>
        

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fefefe;
            
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #4d4d4d;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 1.5em;
            color: #af9d8f;
        }
        .instruction {
            margin: 10px 0;
            font-size: 1em;
            font-weight:500;
            color: #666;
        }
        /* Header */
        #header-bar {
            background-color: #444;
            color:#bbb;
            width: 100%;
            /* padding: 15px 10px; */
            position: fixed;
            cursor:default;
            top: 0;
            left: 0;
            z-index: 10000;
            height: 3.25em;
            line-height: 3.25em;
            font-family: 'Source Sans Pro', sans-serif;
            font-family: 'Source Sans Pro', sans-serif;
            /*text-align: left; /* 左對齊 */
            /* margin-bottom: 80px; */
        }
        #header-bar a {
            text-decoration: none;
            color: #bbb;
            /* font-size: 17.5px; */
            /* font-weight: 100; */
            /* margin-right: 20px; */
            margin-left: 18px; /* 左邊微調間距 */
        }
        #referenceObject {
            border: 2px solid #af9d8f;
            width: 100px;
            height: calc(100px / 1.618);
            margin: 15px auto;
        }
        
        
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #cbb7a8;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #af9d8f;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 1em;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .image-grid {
        display: grid;
        grid-template-rows: auto auto;
        gap: 10px;
        margin-top: 20px;
        justify-items: center;
        }
        .main-image img {
            width: 200px;
            height: auto;
            border: 2px solid #af9d8f;
            border-radius: 5px;
        }
        .option-images {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
        }
        .option-images img {
            width: 80px;
            height: auto;
            border: 2px solid #af9d8f;
            border-radius: 5px;
        }
        .highlight{
            color: red;
            font-weight: bold;
        }
        
    </style>
</head>
<body>
    <div id="header-bar">
        <!-- <a href="index.html">Home</a> -->
        <a href="https://227b-2001-b011-2003-bf38-fdcf-bff2-2419-3418.ngrok-free.app/quiz" style="float: left;">VisionCare</a>
    </div>


    <div class="container">
        <h1>測驗說明</h1>
        <p class="instruction">
            請從下方四張圖片選擇出和題目圖片相同的選項<br><strong class="highlight">*注意*:可複選!</strong><br>如需取消選取，請再次點擊已選取的選項。
        </p>

        <div class="image-grid">
            <div class="main-image">
                <img src="static/cb_test_image/rainbow.jpg" alt="主題目圖片">
            </div>
            <div class="option-images">
                <img src="static/cb_test_image/rainbow_tri.jpg" alt="選項1">
                <img src="static/cb_test_image/rainbow_pro.jpg" alt="選項2">
                <img src="static/cb_test_image/rainbow.jpg" alt="選項3">
                <img src="static/cb_test_image/rainbow_deu.jpg" alt="選項4">
            </div>
        </div>

        <button onclick="confirm()">確認</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        // 初始化 WebSocket 連接
        var socket = io.connect('https://227b-2001-b011-2003-bf38-fdcf-bff2-2419-3418.ngrok-free.app');
    
        // WebSocket 連接成功時的處理
        socket.on('connect', function() {
            console.log('WebSocket 連接已打開');
        });

        

        function confirm() {
            const newUrl = `${window.location.origin}/image_test`; 
            window.location.href = newUrl;
        }
    </script>
</body>
</html>
