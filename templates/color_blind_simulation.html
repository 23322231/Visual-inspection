<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/color_sim.css" />
    <title>Color Blindness Simulator</title>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Open+Sans:400,600,400italic,600italic|Roboto+Slab:400,700");

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {    /* 新增 防止網頁內容超出視窗寬度 */
            overflow-x: hidden;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            /* margin-top: 500px; */
            color: #af9d8f;
            font-size: 30px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: 600;
            /* margin-bottom: 20px; */
        }

        /* Header */
        #header-bar {
            background-color: #444; /* 深灰色橫條 */
            color:#bbb;
            width: 100%;
            /* padding: 10px 10px; */
            position: fixed;
            cursor:default;
            top: 0;
            left: 0;
            z-index: 10000;
            height: 3.25em;
            line-height: 3.25em;
            /*text-align: left; /* 左對齊 */
        }
        #header-bar a {
            text-decoration: none;
            color: #BBBBBB;
            /* font-size: 14.5px; */
            font-weight: 200;
            /* margin-top: 20px; */
            margin-left: 18.5px; /* 左邊微調間距 */
        }

        /* #header {
            
            max-width: 800px;
            margin: 0 auto;
            text-align: right;
        } */
        #header {
            max-width: 100%;
            margin: 0 auto;
            text-align: right;
            padding-right: 10px; /* 增加右側內邊距 */
        }

        #header a {
            text-decoration: none;
            color: #BBBBBB; /* 白色的Home文字 */
            font-size: 17.333px;
            font-weight: 200;
            /* padding: 0px 17.333px; */
        }

        /* Image Container */
        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 70px;
            margin-bottom: 15px;
            margin-top: 20px;
        }

        .image-box-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-box {
            border: 2px solid #af9d8f;
            padding: 10px;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            margin-bottom: 10px;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* 保持圖片比例，確保框架高度一致 */
        }

        label {
            /* font-size: 18px;
            font-weight: 600;
            color: #555; */
            color: #646464;
            display: block;
            font-size: 0.9em;
            font-weight: 300;
            margin: 0 0 1em 0;
            text-align: center; /* 文字置中 */
        }

        .btn {
            border: 0px solid #af9d8f;
            color: #efefef;
            background-color: #af9d8f;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            /* transition: background 0.3s; */
            display: inline-block; /* 設置為行內塊元素，支持置中 */
        }

        .btn:hover {
            background-color: #cbb7a8;
        }

        /* Upload and Download Button */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;

        }

        .upload-btn-wrapper .btn {
            background-color: #af9d8f; /* 按鈕的基本背景顏色 */
            border: none;
            color: #fff;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            
        }

        .upload-btn-wrapper .btn:hover {
            background-color: #cbb7a8;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }
        

        /* Radio Group Options */
        .options {
            display: flex;
            justify-content: center;
            text-align: center;
            gap: 120px; 
            width:100%;
            align-items: center; /* 使選項居中對齊 */
        }

        /* button {
            border: 2px solid #af9d8f;
            color: #efefef;
            background-color: #af9d8f;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px; */
            /* transition: background 0.3s; */
            /* display: inline-block; 設置為行內塊元素，支持置中 */
        /* } */
        /* .buttons { */
            /* padding: 12px 30px; 增加按鈕內邊距 */
            /* font-size: 500px; 增加按鈕字體大小 */
            /* color: #fff;
            background-color: #e89980;
            border: none; */
            /* border-radius: 6px; 較方的按鈕 */
            /* cursor: pointer; */
            /* box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); 按鈕陰影加強 */
            /* transition: background-color 0.3s ease, transform 0.2s ease;
        } */

        .radio-group {
            text-align: center; /* 讓選項文字置中 */
            width: auto; /* 去除多餘的寬度設置，以自動調整 */
            padding-left: 15px; 
        }

        .simulation-result {
            margin-top: 20px;
            font-size: 18px;
            color: #af9d8f;
        }

        /* CTA Section */
        #cta {
            background: #af9d8f;
            color: #efefef;
            padding: 2em 0;
            text-align: center;
            margin-top: 30px;
            width: 100%;
        }

        #cta ul {
            list-style: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Mobile Responsiveness */
        @media screen and (max-width: 768px) {
            .image-container {
                flex-direction: column;
                align-items: center;
                gap: 5px;
            }

            .image-box {
                width: 100%;
                max-width: 300px;
            }

            .options {
                flex-direction: column;
                align-items: center;
                text-align:center;
                gap:35px;
                padding-left: 10px; /* 新增右側填充，將群組稍微向左調整 */
            }

            .radio-group {
                margin: 0;                
            }

            .radio-group label {
                margin-bottom: 5px; /* 減少 label 的 margin */
            }
        }

        @media screen and (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            #header a {
                font-size: 16px;
            }

            .btn {
                font-size: 14px;
            }

            #cta {
                padding: 1em 0;
            }
        }
    </style>
</head>

<body>
    <div id="header-bar">
        <a href="https://227b-2001-b011-2003-bf38-fdcf-bff2-2419-3418.ngrok-free.app/quiz" style="float: left">VisionCare</a>
    </div>

    <div class="container">
        <h1>色覺障礙模擬</h1>

        <form method="POST" enctype="multipart/form-data">
            <div class="image-container">
                <div class="image-box-wrapper">
                    <label>原始圖片</label>
                    <div class="image-box">
                        <img src="static/images/original.png" id="before-img" alt="Original Image">
                    </div>
                    <div class="upload-btn-wrapper">
                        <button class="btn">上傳圖片</button>
                        <input type="file" name="file" id="upload-img" accept="image/*">
                    </div>
                </div>
                <div class="image-box-wrapper">
                    <label>模擬圖片</label>
                    <div class="image-box">
                        <img src="static/images/original.png" id="after-img" alt="Simulated Image">
                    </div>
                    <button class="btn" id="download-btn">下載圖片</button>
                </div>
            </div>

            <div class="options">
                <div class="radio-group">
                    <label>選擇色覺障礙模擬類型：</label>
                    <input type="radio" id="red_blindness" name="cb_type" value="0" required>
                    <label for="red_blindness">紅色</label>
                    <input type="radio" id="green_blindness" name="cb_type" value="1">
                    <label for="green_blindness">綠色</label>
                    <input type="radio" id="blue_blindness" name="cb_type" value="2">
                    <label for="blue_blindness">藍色</label>
                </div>

                <div class="radio-group">
                    <label>選擇嚴重程度：</label>
                    <input type="radio" id="mild" name="severity" value="0" required>
                    <label for="mild">輕微</label>
                    <input type="radio" id="moderate" name="severity" value="1">
                    <label for="moderate">中度</label>
                    <input type="radio" id="severe" name="severity" value="2">
                    <label for="severe">嚴重</label>
                </div>
            </div><br>

            
            <button class="btn" type="submit" onclick="simulate()">模擬</button>
            <div id="simulation-result" class="smulation-result"></div>
        </form>
    </div>
    <script src="static/assets/js/simulation_script.js"></script>
    <section id="cta">
        <ul>
            <li>*免責聲明：有關近視的建議和進一步資訊，請諮詢您的視力保健專業人員。本系統之視覺模擬器僅供參考，不代表建議。</li>
        </ul>
    </section>
</body>
</html>
