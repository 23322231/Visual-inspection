<!-- 正式版 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Blindness Simulator</title>
    <style>
        @import url("fontawesome-all.min.css");
        @import url("https://fonts.googleapis.com/css?family=Open+Sans:400,600,400italic,600italic|Roboto+Slab:400,700");
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #e9c4b9;  /*#e0f7fa*/
        }
        .container {
            margin: 0 auto;
            padding: 20px;
        }
        .image-box {
            border: 1px solid black;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            gap: 40px;
        }
        img {
            max-width: 100%; /* 讓圖片根據網頁的排版自動調整大小 */
            height: auto;   /* 保持圖片的比例 */
        }
        label {
            font-size: 18px;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }
        .btn {
            border: 2px solid #008CBA;
            color: white;
            background-color: #008CBA;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }
        .options {
            display: flex;
            justify-content: space-around;
        }
        .radio-group {
            margin: 0 20px;
        }
        .buttons {
            margin-top: 20px;
        }
        /* Header */
        
        #header .icons {
            text-align: right;
            margin-right: 50px;    
        }

        #header ul > a:not(.button) {
            color: #999; /* 首頁上面 Home Layouts...那些字 */
            display: inline-block;
            text-decoration: none;
            border: 0;
        }

        #header ul > a:not(.button):before, a:not(.button):after{
        color: #999;
        margin-right: 5em;
        }

        #cta {
		background: #e89980;
		color: #f9e6df;
		padding: 3.5em 0 4em 0;
		text-align: center;
	}

		#cta h2, #cta h3, #cta h4, #cta h5, #cta h6 {
			color: inherit;
		}

		#cta form {
			margin: 0 auto;
			max-width: 100%;
			width: 25em;
		}

		#cta input[type="submit"],
		#cta input[type="reset"],
		#cta input[type="button"],
		#cta .button {
			box-shadow: none;
			background: #fff;
			color: #e89980;
		}

		#cta input[type="text"],
		#cta input[type="password"],
		#cta input[type="email"],
		#cta select,
		#cta textarea {
			color: #ffffff;
			background: rgba(255, 255, 255, 0.15);
			border: 0;
		}

			#cta input[type="text"]:focus,
			#cta input[type="password"]:focus,
			#cta input[type="email"]:focus,
			#cta select:focus,
			#cta textarea:focus {
				box-shadow: inset 0 0 0 2px #fff;
			}

		#cta ::-webkit-input-placeholder {
			color: rgba(255, 255, 255, 0.75) !important;
		}

		#cta :-moz-placeholder {
			color: rgba(255, 255, 255, 0.75) !important;
		}

		#cta ::-moz-placeholder {
			color: rgba(255, 255, 255, 0.75) !important;
		}

		#cta :-ms-input-placeholder {
			color: rgba(255, 255, 255, 0.75) !important;
		}

		#cta .formerize-placeholder {
			color: rgba(255, 255, 255, 0.75) !important;
		}
    
    
        /* Mobile (Portrait) */

	@media screen and (max-width: 480px) {

    /* Basic */

        html, body {
            min-width: 320px;
        }

        body, input, select, textarea {
            font-size: 11pt;
        }

    /* Section/Article */

        header.major {
            padding: 0;
        }

    /* List */

        ul.actions {
            margin: 0 0 2em 0;
        }

            ul.actions li {
                display: block;
                padding: 1em 0 0 0;
                text-align: center;
                width: 100%;
            }

                ul.actions li:first-child {
                    padding-top: 0;
                }

                ul.actions li > * {
                    width: 100%;
                    margin: 0 !important;
                }

                    ul.actions li > *.icon:before {
                        margin-left: -2em;
                    }

            ul.actions.small li {
                padding: 0.5em 0 0 0;
            }

                ul.actions.small li:first-child {
                    padding-top: 0;
                }

    /* Box */

        .box {
            border-radius: 0;
            box-shadow: none;
            margin: 1em 0 0 0;
            padding: 3em 1em !important;
        }

            .box.features .features-row section {
                margin: 3em 0 0 0 !important;
                padding: 3em 0 0 0 !important;
            }

            .box .image.featured {
                border-radius: 0;
                margin-left: -1em;
                width: calc(100% + 2em);
            }

                .box .image.featured img {
                    border-radius: 0 !important;
                }

                .box .image.featured:first-child {
                    margin-bottom: 3em;
                    margin-top: -3em;
                }

                .box .image.featured:last-child {
                    margin-bottom: -3em;
                    margin-top: 3em;
                }

    /* Banner */

        #banner {
            padding: 5em 3em 4em 3em;
        }

    /* Main */

        #main > .box:first-child {
            margin-top: 0;
        }

    /* CTA */

        #cta {
            padding: 2.5em 1em 3em 1em;
        }

    }
    </style>
</head>
    
<body>
    <header id="header">
        <ul class="icons">
            <a href="http://192.168.1.121:5000/quiz">Home</a>
        </ul>
    </header>

<div class="container">
    <h1>色盲模擬</h1>

    <form method="POST" enctype="multipart/form-data">
        <div class="image-container">
            <div>
                <label>上傳前圖片</label>
                <div class="image-box">
                    <img src="../static/original.png" id="before-img" alt="Original Image">
                </div><br>
                <!-- 自定義上傳按鈕 -->
                <div class="upload-btn-wrapper">
                    <button class="btn">上傳圖片</button>
                    <input type="file" name="file" id="upload-img" accept="image/*">
                </div>
            </div>
            <div>
                <label>模擬後圖片</label>
                <div class="image-box">
                    <img src="../static/original.png" id="after-img" alt="Simulated Image">
                </div><br>
                <button class="btn" id="download-btn">下載圖片</button>
            </div>
        </div>

        <div class="options">
            <div class="radio-group">
                <label>選擇色盲類型：</label><br>
                <input type="radio" id="red_blindness" name="cb_type" value="0" required>
                <label for="red_blindness">紅色色盲</label><br>
                <input type="radio" id="green_blindness" name="cb_type" value="1">
                <label for="green_blindness">綠色色盲</label><br>
                <input type="radio" id="blue_blindness" name="cb_type" value="2">
                <label for="blue_blindness">藍色色盲</label>
            </div>

            <div class="radio-group">
                <label>選擇嚴重程度：</label><br>
                <input type="radio" id="mild" name="severity" value="0" required>
                <label for="mild">輕微</label><br>
                <input type="radio" id="moderate" name="severity" value="1">
                <label for="moderate">中度</label><br>
                <input type="radio" id="severe" name="severity" value="2">
                <label for="severe">嚴重</label>
            </div>
        </div><br>

        <button class="btn" type="submit">模擬</button>
    </form>

    <section id="cta">
        <ul>
            <li>*免責聲明：有關近視的建議和進一步資訊，請諮詢您的視力保健專業人員。本系統之視覺模擬器僅供參考，不代表建議。</li>
        </ul>
    </section>
</div>

<script src="static/assets/js/simulation_script.js"></script>
</body>
</html>
