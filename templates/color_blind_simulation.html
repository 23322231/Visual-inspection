<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Color Blindness Simulator</title>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Open+Sans:400,600,400italic,600italic|Roboto+Slab:400,700");

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {    /* 新增 防止網頁內容超出視窗寬度 */
            overflow-x: hidden;
        }

        body {
            font-family: 'Source Sans Pro', sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #d15b4d;
            margin-bottom: 20px;
        }

        /* Header */
        #header-bar {
            background-color: #444; /* 深灰色橫條 */
            width: 100%;
            padding: 20px 10px;
        }

        /* #header {
            
            max-width: 800px;
            margin: 0 auto;
            text-align: right;
        } */
        #header {
            max-width: 100%;
            margin: 0 auto;
            text-align: right;
            padding-right: 10px; /* 增加右側內邊距 */
        }

        #header a {
            text-decoration: none;
            color: #ffffff; /* 白色的Home文字 */
            font-size: 17.333px;
            font-weight: 200;
            /* padding: 0px 17.333px; */
        }

        /* Image Container */
        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .image-box-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-box {
            border: 2px solid #d15b4d;
            padding: 10px;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            margin-bottom: 10px;
        }

        .image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* 保持圖片比例，確保框架高度一致 */
        }

        label {
            /* font-size: 18px;
            font-weight: 600;
            color: #555; */
            color: #646464;
            display: block;
            font-size: 0.9em;
            font-weight: 300;
            margin: 0 0 1em 0;
            text-align: center; /* 文字置中 */
        }

        /* Upload and Download Button */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
        }

        .btn {
            border: 2px solid #e89980;
            color: #fff;
            background-color: #e89980;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            /* transition: background 0.3s; */
            display: inline-block; /* 設置為行內塊元素，支持置中 */
        }

        .btn:hover {
            background-color: #b94c42;
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }

        /* Radio Group Options */
        .options {
            display: flex;
            justify-content: space-between;
            text-align: center;
            /* gap: 40px; */
            /* margin-top: 20px; */
            /* color: #666; */
            /* flex-wrap: wrap; */
        }

        .radio-group {
            /* margin: 15px 80px; */
            flex: 1;
        }

        /* CTA Section */
        #cta {
            background: #e89980;
            color: #f9e6df;
            padding: 2em 0;
            text-align: center;
            margin-top: 30px;
            width: 100%;
        }

        #cta ul {
            list-style: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Mobile Responsiveness */
        @media screen and (max-width: 768px) {
            .image-container {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            .image-box {
                width: 100%;
                max-width: 300px;
            }

            .options {
                flex-direction: column;
                align-items: center;
            }

            .radio-group {
                margin: 0;
                flex: 1;
            }
        }

        @media screen and (max-width: 480px) {
            h1 {
                font-size: 24px;
            }

            #header a {
                font-size: 16px;
            }

            .btn {
                font-size: 14px;
            }

            #cta {
                padding: 1em 0;
            }
        }
    </style>
</head>

<body>
    <div id="header-bar">
        <header id="header">
            <a href="http://192.168.1.121:5000/quiz">Home</a>
        </header>
    </div>

    <div class="container">
        <h1>色覺障礙模擬</h1>

        <form method="POST" enctype="multipart/form-data">
            <div class="image-container">
                <div class="image-box-wrapper">
                    <label>原始圖片</label>
                    <div class="image-box">
                        <img src="static/images/original.png" id="before-img" alt="Original Image">
                    </div>
                    <div class="upload-btn-wrapper">
                        <button class="btn">上傳圖片</button>
                        <input type="file" name="file" id="upload-img" accept="image/*">
                    </div>
                </div>
                <div class="image-box-wrapper">
                    <label>模擬圖片</label>
                    <div class="image-box">
                        <img src="static/images/original.png" id="after-img" alt="Simulated Image">
                    </div>
                    <button class="btn" id="download-btn">下載圖片</button>
                </div>
            </div>

            <div class="options">
                <div class="radio-group">
                    <label>選擇色覺障礙模擬類型：</label>
                    <input type="radio" id="red_blindness" name="cb_type" value="0" required>
                    <label for="red_blindness">紅色</label>
                    <input type="radio" id="green_blindness" name="cb_type" value="1">
                    <label for="green_blindness">綠色</label>
                    <input type="radio" id="blue_blindness" name="cb_type" value="2">
                    <label for="blue_blindness">藍色</label>
                </div>

                <div class="radio-group">
                    <label>選擇嚴重程度：</label>
                    <input type="radio" id="mild" name="severity" value="0" required>
                    <label for="mild">輕微</label>
                    <input type="radio" id="moderate" name="severity" value="1">
                    <label for="moderate">中度</label>
                    <input type="radio" id="severe" name="severity" value="2">
                    <label for="severe">嚴重</label>
                </div>
            </div><br>

            
            <button class="btn" type="submit" onclick="simulate()">模擬</button>
            <div id="simulation-result" class="smulation-result"></div>
        </form>
    </div>
    <script src="static/assets/js/simulation_script.js"></script>
    <section id="cta">
        <ul>
            <li>*免責聲明：有關近視的建議和進一步資訊，請諮詢您的視力保健專業人員。本系統之視覺模擬器僅供參考，不代表建議。</li>
        </ul>
    </section>
</body>
</html>
