<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>確認是否進入作答畫面的頁面</title>
    <style>
        /* Header */
        #header-bar {
            background-color: #444;
            width: 100%;
            padding: 15px 10px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 15;
            text-align: left; /* 左對齊 */
            /* margin-bottom: 80px; */
        }
        #header-bar a {
            text-decoration: none;
            color: #ffffff;
            font-size: 17px;
            font-weight: 200;
            margin-right: 20px;
            margin-left: 10px; /* 左邊微調間距 */
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffffff;
            /*background-image: url("static/images/pic04.jpg");*/
            background-size: cover;
            font-family: 'Arial', sans-serif;
        }
        .container {
            text-align: center;
            background-color: #cbb7a8;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2em;
            color: #fefefe;
            margin-bottom: 20px;
        }
        button {
            background-color: #af9d8f;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #af9d8f;
        }
    </style>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        var socket = io.connect('https://53e1-2001-b011-2003-35a3-94dc-b89a-2dee-8bed.ngrok-free.app');
        // var socket = io();

        socket.on('connect', function() {
            console.log('WebSocket 連接已打開');
        });

        socket.on('connect_error', function(error) {
            console.error('WebSocket 連接錯誤:', error);
        });

        socket.on('disconnect', function() {
            console.log('WebSocket 連接已關閉');
        });

        function generateUniqueURL() {
        // 向伺服器端 (app.py) 發送 一個HTTP GET 請求到 '/generate-url' 端点
            fetch('/generate-url')
                .then(response => response.json())  // 將response解析為 JSON 格式
                .then(data => {
                    // 檢查response數據中是否包含 URL
                    if (data.url) {
                        
                        // 獲取 URL 的后缀部分 從=的地方切 http://192.168.0.155:5000/comfirm_colordot?session=705c8991-e61c-4600-a5f7-f566330a6a5d
                        var urlSuffix = data.url.split('=').pop();
                        // alert('Sent1 urlSuffix: ' + urlSuffix);  //debug
                        // console.log('Emitting confirmDrawing with urlSuffix:', urlSuffix);
                        // 發送 WebSocket 消息通知 QRcode頁面更新
                        // document.addEventListener("DOMContentLoaded", function() {
                        //     socket.emit('confirmDrawing', {'urlSuffix': urlSuffix});
                        // });
                        socket.emit('confirmDrawing', {'urlSuffix': urlSuffix});
                        // alert('Sent2 urlSuffix:'+ urlSuffix); 

                        // 將瀏覽器重新定向到生成的唯一URL
                        window.location.href = data.url;
                    } else {
                        // 如果没有 URL，在控制台中輸出錯誤
                        console.error('Error generating URL');
                    }
                })
                .catch(error => {
                    // 如果請求過程中出現錯誤，則在控制台中輸出錯誤訊息
                    console.error('Error:', error);
                });
         }
        

    </script>
</head>
<body>
    <div id="header-bar">
        <a href="https://53e1-2001-b011-2003-35a3-94dc-b89a-2dee-8bed.ngrok-free.app/quiz" style="float: left;">VisionCare</a>
    </div>
    <div class="container">
        <h1>進入色盲點圖測驗</h1>
        <button onclick="generateUniqueURL()">確認</button>
    </div>
</body>
</html>
