<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/eye_dis_computer.css" />
    <title>距離測量中</title>
    <style>
        
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffffff;
            /* font-family: 'Arial', sans-serif; */
            color: #333;
        }

        #header-bar {
            background-color: #444; /* 深灰色橫條 */
            color:#bbb;
            width: 100%;
            /* padding: 10px 10px; */
            position: fixed;
            cursor:default;
            top: 0;
            left: 0;
            z-index: 10000;
            height: 3.25em;
            line-height: 3.25em;
            /*text-align: left; /* 左對齊 */
        }
        #header-bar a {
            text-decoration: none;
            color: #BBBBBB;
            font-size: 17.5px;
            font-weight: 200;
            /* margin-right: 20px; */
            margin-left: 20.5px; /* 左邊微調間距 */
        }

        .container {
            text-align: center;
            background-color: #af9d8f;
            padding: 45px;
            border-radius: 15px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 3em;
            margin: 0;
            color: #ffffff;
        }

        .loading {
            margin-top: 30px;
            font-size: 1.5em;
            color: #ffffff;
            font-style: italic;
            margin-bottom: -5px;
        }

        /* 添加一個簡單的動畫效果 */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .loading::after {
            content: '...';
            animation: blink 1.5s infinite;
        }
    </style>
</head>
<body>
    <div id="header-bar">
        <!-- <a href="index.html">Home</a> -->
        <a href="index.html" style="float: left;">VisionCare</a>
    </div>

    <div class="container">
        <h1>距離測量中</h1>
        <p class="loading">請稍候</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
<script>

    // 初始化 WebSocket 連接
    var socket = io.connect('https://767f-2001-b011-2003-bf38-4d58-2a3a-a2ad-6c2.ngrok-free.app');
    // var socket = io();

    // 收到更新頁面消息時的處理
    socket.on('eye_into_test_confirm', function(message) {
        console.log('Received message:'+ JSON.stringify (message));
        depth=message.depth_value;
        // 新的URL
        var newUrl = window.location.origin + '/eye_Etest?session=' + message.eye_user_id +'&depth=' + depth;
        window.location.href = newUrl;
    });
    // WebSocket 連接成功時的處理
    socket.on('connect', function() {
        console.log('WebSocket 連接已打開');
    });
</script>
</body>
</html>
