        <style>
            /* 為 Home 按鈕設置樣式 */
            /* Basic Flex Layout for Full Height */
            body {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
                margin: 0;
            }

            /* Main content section to hold the canvas and button */
            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding-bottom: 20px; /* Prevents overlap with CTA */
            }

            /* Home Button Styles */
            #home-button {
                display: inline-block;
                padding: 8px 16px;
                margin-bottom: 10px;
                color: #fefefe;
                background-color: #af9d8f;
                text-decoration: none;
                border-radius: 5px;
                font-size: 14px;
                font-family: Arial, sans-serif;
                transition: background-color 0.3s ease;
            }

            #top-left {
                position: fixed;
                top: 10px;
                left: 10px;
                z-index: 10;
            }

            /* Canvas width adjustments for different screens */
            @media (max-width: 600px) {
                #canvas {
                    width: 40vw;
                    height: auto;
                }
            }

            @media (min-width: 601px) and (max-width: 1024px) {
                #canvas {
                    width: 70vw;
                    height: auto;
                }
            }

            @media (min-width: 1025px) {
                #canvas {
                    width: 60vw;
                    height: auto;
                }
            }
