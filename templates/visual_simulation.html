								<div  style="text-align:center;">
									<h4>Original</h4>
								</div>
							</span></div>
							<div class="col-6"><span class="image fit">
								<img id="afterImage" src="static/images/letter_e.png" style="border:2px #af9d8f solid;" alt="" />
								<div  style="text-align:center;">
									<h4>Blurred</h4>
								</div>
							</span></div>
						</div>
						<!-- 顯示目前的度數文字 -->
						<h4 id="myopiaLabel" style="text-align: center;margin-top:10px ;width:100%;height: 100%;">近視度數：0，遠視度數：0，散光度數：0，散光角度：0</h4>
						<!-- 調整度數部分 -->
						<div class="ranges" >
							<div class="row gtr-50 gtr-uniform">
								<div  style="text-align:left;width:50%;">
									<h4>近視度數</h4>
								</div>
								<div  style="text-align:right;width:50%;">
									<h4>遠視度數</h4>
								</div>
							</div>
							<!-- 拉條部分 -->
							<div>
								<input type="range" id="myopia" min="-200" max="200" step="25" value="0" onchange="adjustImage(); updateLabel()" />
						
							</div>

							<div class="control-item">
								<h4 for="degree">散光角度</h4>
								<input type="range" id="degree" min="0" max="180" step="15" value="0" onchange="adjustImage(); updateLabel()">
							</div>
							<div class="control-item">
								<h4 for="astigmatism">散光度數</h4>
								<input type="range" id="astigmatism" min="0" max="200" step="25" value="0" onchange="adjustImage(); updateLabel()">
							</div>
						</div>	

						<!-- 依據度數調整圖片部分 -->
						<script>
							function updateLabel() {
								// 近視遠視度數
								const myopia = document.getElementById('myopia').value;
								// 散光角度
								const degree = document.getElementById('degree').value;
								// 散光度數
								const astigmatism = document.getElementById('astigmatism').value;
								//要改字的 label id
								const label = document.getElementById('myopiaLabel');

								if(myopia>0){
									s="近視度數：0，遠視度數："+String(myopia)+"，散光度數："+String(astigmatism)+"，散光角度："+String(degree)
								}
								else{
									s="近視度數："+String((-myopia))+"，遠視度數：0，散光度數："+String(astigmatism)+"，散光角度："+String(degree)
								}
								
								label.textContent = s;
							}
							function downloadImage() {
								const image = document.getElementById('afterImage');
								const link = document.createElement('a');
								link.href = image.src;
								link.download = 'downloaded_image.png';
								link.click();
							}
					
							function adjustImage() {
								// 近視遠視度數
								const myopia = document.getElementById('myopia').value;
								// 散光角度
								const degree = document.getElementById('degree').value;
								// 散光度數
								const astigmatism = document.getElementById('astigmatism').value;
								// 要更新的圖片
								const rightImage = document.getElementById('afterImage');
								if(myopia){
									document.elementFromPoint
								}
								// 根據滑桿值來模擬不同的視覺變化
								if (myopia == 0 && astigmatism == 0) {
									rightImage.src = "static/images/letter_e.png";  // 如果滑桿皆為0，顯示原圖
								} 
								else if (astigmatism == 0){//只有近視或遠視
									// 模擬不同度數時的圖片(替代圖片)
									s="static/vision_blur\\"+String(myopia)+'.0_img.jpg'
									rightImage.src = s;  
								}
								else{//近視遠視與散光
									s="static/vision_blur\\"+String(astigmatism)+".0_"+String(degree)+"_"+String(myopia)+'.0_img.jpg'
									rightImage.src = s;  
								}
							}
						</script>
