<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色盲圖片測驗結果</title>
    <style>
        @import url("https://fonts.googleapis.com/css?family=Open+Sans:400,600,400italic,600italic|Roboto+Slab:400,700");

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Basic Styling */
        body {
            font-family: 'Source Sans Pro', sans-serif;
            background-color: #ffffff;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin: auto;
            padding: 20px;
            text-align: center;
            flex-grow: 1; /* 讓內容區域撐滿可用空間 */
        }

        h1 {
            color: #d15b4d;
            margin-bottom: 20px;
        }

        /* Header */
        #header-bar {
            background-color: #444; /* 深灰色橫條 */
            width: 100%;
            padding: 20px 10px;
        }

        #header {
            max-width: 100%;
            margin: 0 auto;
            text-align: right;
            padding-right: 10px;
        }

        #header a {
            text-decoration: none;
            color: #ffffff;
            font-size: 17.333px;
            font-weight: 200;
        }

        /* Title Styling */
        h2 {
            color: #444;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            
        }

        /* Result Styling */
        #result {
            background-color: #f5f5f5;
            color: #4f4e4e;
            padding: 20px;
            font-size: 24px;
            font-weight: 600;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 50px auto 0; /* 往下移動 */
            max-width: 400px;
            text-align: center;
        }

        /* CTA Section */
        #cta {
            background: #e89980;
            color: #f9e6df;
            padding: 2em 0;
            text-align: center;
            width: 100%;
            margin-top: auto; /* 將 CTA 區塊推到底部 */
        }

        #cta ul {
            list-style: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Mobile Responsiveness */
        @media screen and (max-width: 768px) {
            #result {
                font-size: 20px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="header-bar">
        <header id="header">
            <a href="http://192.168.1.121:5000/quiz">Home</a>
        </header>
    </div>

    <!-- Main Content -->
    <div class="container">
        <header>
            <h2>色盲圖片測驗結果</h2>                
        </header>
        <div id="result">
            <!-- 顯示測驗結果 -->
        </div>

        <script>
            // 從 localStorage 讀取結果
            const resultMessage = localStorage.getItem('resultMessage');

            // 顯示結果
            if (resultMessage) {
                document.getElementById('result').innerText = resultMessage;
            } else {
                document.getElementById('result').innerText = "無法獲取測驗結果。";
            }
        </script>
    </div>

    <!-- Footer with CTA and Disclaimer -->
    <section id="cta">
        <ul>
            <li>*免責聲明：有關近視的建議和進一步資訊，請諮詢您的視力保健專業人員。本系統之視覺模擬器僅供參考，不代表建議。</li>
        </ul>
    </section>
</body>
</html>
