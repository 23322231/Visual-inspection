<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測量距離</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 1rem;
            color: #555;
            margin-top: 20px;
        }
        #distance, #timer {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin: 8px 0;
        }
        .stream-wrapper {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .stream-wrapper img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 2px solid #ddd;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            h1 {
                font-size: 1rem;
            }
            h2 {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>臉上有出現綠色框框才是有偵測到喔!</h1>

        <div class="stream-wrapper">
            <!-- 用於顯示影像流 -->
            <img src="{{ url_for('video_feed') }}" alt="Camera Stream">
        </div>

        <h2>眼中和鏡頭相距:</h2>
        <p id="distance">計算中...</p>

        <h2>剩餘時間:</h2>
        <p id="timer">3</p>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        // 初始化 WebSocket 連接
        var socket = io.connect('https://a99e-2001-b011-2003-fbb8-61c0-c59-2040-22f5.ngrok-free.app');

        // Fetch data from the API endpoint every second
        var distance = 0;
        var time = 3;
        setInterval(() => {
            socket.on('data_feed', function(data) {
                document.getElementById('timer').innerText = data.time;
                document.getElementById('distance').innerText = `${data.depth} 公尺`;
                distance = data.depth;
                time = data.time;
            });
            if (distance > 0 && time<=0 ) {  //確保獲得有效距離
                console.log('data.depth:', distance);
                var urlSuffix = window.location.href.split('=').pop();
                socket.emit('eye_into_test', {'urlSuffix': urlSuffix,'depth_value':distance});
                window.location.href = window.location.origin + '/eye_user_check?session=' + location.href.split('=').pop();
            }
        }, 1000);  // 每秒更新一次

        document.addEventListener("DOMContentLoaded", function() {
            var urlSuffix = window.location.href.split('=').pop();
            socket.emit('confirm_eye_dis', {'urlSuffix': urlSuffix});
        });
    </script>
</body>
</html>
