<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>調整視力測驗圖片大小</title>
    <style>
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            /* background-color: #f8e6e6; */
            background-image:url("static/images/pic04.jpg");
            background-size: cover;
            font-family: Arial, sans-serif;
            color: #4d4d4d;
        }
        .container {
            text-align: center;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 20px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 1.5em;
            color: #df9898;
        }
        .instruction {
            margin: 10px 0;
            font-size: 1em;
            color: #666;
        }
        #referenceObject {
            border: 2px solid #df9898;
            width: 100px;
            height: calc(100px / 1.618);
            margin: 15px auto;
        }
        #sliderContainer {
            margin: 20px auto;
            width: 100%;
        }
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 8px;
            background: linear-gradient(80deg, #df9898, #f8c1c1);
            outline: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #ffffff;
            border: 2px solid #e89980;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #ffffff;
            border: 2px solid #e89980;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1em;
            color: #fff;
            background-color: #e89980;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #d47a7a;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 15px;
            font-size: 1em;
            color: #fff;
            /* background-color: #e89980; */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        /* .back-button:hover { */
            /* background-color: #d47a7a; */
        /* } */
    </style>
</head>
<body>

    <button class="back-button" onclick="history.back()">回前頁</button>

    <div class="container">
        <h1>調整E字測驗圖片大小</h1>
        <p class="instruction">
            請將信用卡或其他長寬為85.60毫米、53.98毫米的卡片放在螢幕上框框中，並調整下方滑桿，使其與物品大小一致。
        </p>

        <div id="referenceObject"></div>
        <p class="instruction">寬度：<span id="widthDisplay">100</span> 像素 | 高度：<span id="heightDisplay">62</span> 像素</p>

        <div id="sliderContainer">
            <label for="sizeSlider">調整大小:</label>
            <input type="range" id="sizeSlider" min="50" max="500" value="100">
        </div>

        <button onclick="confirmAndRedirect()">確認</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        // 初始化 WebSocket 連接
        var socket = io.connect('http://127.0.0.1:5000');
    
        // WebSocket 連接成功時的處理
        socket.on('connect', function() {
            console.log('WebSocket 連接已打開');
        });

        const referenceObject = document.getElementById('referenceObject');
        const widthDisplay = document.getElementById('widthDisplay');
        const heightDisplay = document.getElementById('heightDisplay');
        const sizeSlider = document.getElementById('sizeSlider');
        const goldenRatio = 1.618;

        // 更新方框大小
        sizeSlider.addEventListener('input', updateSize);

        function updateSize() {
            const containerWidth = document.querySelector('.container').offsetWidth * 0.9; // 容器的 90% 寬度
            let widthPx = sizeSlider.value;

            // 限制框框寬度
            if (widthPx > containerWidth) {
                widthPx = containerWidth;
            }

            const heightPx = widthPx / goldenRatio;

            referenceObject.style.width = widthPx + 'px';
            referenceObject.style.height = heightPx + 'px';

            widthDisplay.textContent = Math.round(widthPx);
            heightDisplay.textContent = Math.round(heightPx);
        }

        // 確認並跳轉到顯示 E 字圖片的頁面，發送寬度數據
        function confirmAndRedirect() {
            const widthPx = referenceObject.offsetWidth;
            const heightPx = referenceObject.offsetHeight;

            fetch('/send_width_height', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 'widthPx': widthPx, 'heightPx': heightPx })
            }).then(response => {
                console.log('Data saved to session');
            });

            const newUrl = `${window.location.origin}/eye_qrcode?session=${location.href.split('=').pop()}`; 
            window.location.href = newUrl;
        }
    </script>
</body>
</html>
