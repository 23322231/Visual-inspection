<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/eye_user_check.css" />
    <title>確認辨識頁面</title>
    <style>
        

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }

        .confirmation-box {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            background-color: #af9d8f;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 80%;
            margin: 0 auto;
        }

        h1 {
            color: #fff;
            font-size: 24px;
            margin: 10px 0;
        }

        p {
            font-size: 20px;
            color: #fff;
        }

        .button-group {
            margin-top: 20px;
        }

        .start-btn, .confirm-btn, .retry-btn ,.giveup-btn{
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            color: white;
        }

        .start-btn {
            background-color: #cbb7a8;
        }

        .confirm-btn {
            background-color: #4caf50;
            display: none;
        }

        .retry-btn {
            background-color: #f44336;
            display: none;
        }

        .giveup-btn {
            background-color: #8b9aa2;
            display: none;
        }
        /* Header */
        #header-bar {
            background-color: #444;
            color:#bbb;
            width: 100%;
            /* padding: 15px 10px; */
            position: fixed;
            cursor:default;
            top: 0;
            left: 0;
            z-index: 10000;
            height: 3.25em;
            line-height: 3.25em;
            font-family: 'Source Sans Pro', sans-serif;
            font-family: 'Source Sans Pro', sans-serif;
            /*text-align: left; /* 左對齊 */
            /* margin-bottom: 80px; */
        }
        #header-bar a {
            text-decoration: none;
            color: #bbb;
            font-size: 17.5px;
            /* font-weight: 100; */
            /* margin-right: 20px; */
            margin-left: 20.5px; /* 左邊微調間距 */
        }
    </style>
</head>
<body>
    <div id="header-bar">
        <!-- <a href="index.html">Home</a> -->
        <a href="https://3bd4-2001-b011-2003-35a3-30fd-207e-2c70-5bff.ngrok-free.app/quiz" style="float: left;">VisionCare</a>
    </div>

    <div class="confirmation-box">
        <h1 id="direction-text">測驗中請不要移動您的位置，按照螢幕上的E字圖片缺口用"食指"比出正確方向，<br>並使用手機確認您的作答方向</h1>
        <p id="countdown-text"></p>

        <div class="button-group">
            <button class="start-btn" id="start-btn">確定</button>
            <button class="confirm-btn" id="confirm-btn">確認</button>
            <button class="retry-btn" id="retry-btn">重新作答</button>
            <button class="giveup-btn" id="giveup-btn">看不見</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        const socket = io.connect('https://3bd4-2001-b011-2003-35a3-30fd-207e-2c70-5bff.ngrok-free.app');
        let countdown, currentDirection, sureDirection = '';  // 儲存目前方向
        let answer ;//存使用者的答案
        // 隱藏 direction-text（只出現第一次）
        function hideDirectionText() {
            document.getElementById('direction-text').style.display = 'none';
            document.getElementById('start-btn').style.display = 'none';
        }

        // 初始「確定」按鈕事件，啟動偵測流程 //第一次確定開始作答的按鈕
        document.getElementById('start-btn').addEventListener('click', function() {
            socket.emit('next_Etest');
            startDetection();
        });

        // 啟動偵測流程
        function startDetection() {
            document.getElementById('confirm-btn').style.display = 'none';
            document.getElementById('start-btn').style.display = 'none';  // 隱藏「確定」按鈕
            startCountdown();  // 開始倒數計時
        }

        // 倒數3秒計時器，持續更新方向
        function startCountdown() {
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('giveup-btn').style.display = 'none';
            let seconds = 3;
            const countdownText = document.getElementById('countdown-text');

            countdownText.textContent = `倒數：${seconds} 秒 | 偵測方向: ${currentDirection}`;

            countdown = setInterval(() => {
                seconds--;
                countdownText.textContent = `倒數：${seconds} 秒 | 偵測方向: ${currentDirection}`;

                if (seconds <= 0) {
                    clearInterval(countdown);  // 停止倒數
                    showFinalDirection();  // 顯示最終方向
                }
            }, 1000);

            // 第一次之後隱藏 h1 標題
            hideDirectionText();
        }

        // 顯示最終方向並啟用「確認」與「重新作答」按鈕
        function showFinalDirection() {
            const directionText = document.getElementById('direction-text');
            directionText.textContent = `最終方向: ${currentDirection}`;
            sureDirection = currentDirection;  // 紀錄最終方向
            
            
            directionText.style.display = 'block';  // 顯示最終方向文字

            // 顯示按鈕
            document.getElementById('confirm-btn').style.display = 'inline-block';
            document.getElementById('retry-btn').style.display = 'inline-block';
            document.getElementById('giveup-btn').style.display = 'inline-block';
        }

        // 接收手指方向更新事件
        socket.on('hand_direction', function(data) {
            console.log('hand_direction:', data);
            currentDirection = data.direction;  // 更新方向
        });

        // 確認按鈕事件，記錄答案
        document.getElementById('confirm-btn').addEventListener('click', function() {
            
            if (sureDirection == 'up') {
                answer=0;
            } else if (sureDirection == 'down') {
                answer=1;
            } else if (sureDirection == 'left') {
                answer=2;
            } else if (sureDirection == 'right') {
                answer=3;
            }

            socket.emit('next_Etest');//告訴電腦端可以下一題
            socket.emit('eye-user-answer', {'eye_user_answer': answer}); // 發送使用者的答案
            startDetection();
        });

        // 放棄按鈕事件，記錄使用者放棄此題(4) 
        document.getElementById('giveup-btn').addEventListener('click', function() {
            
            answer=4;

            socket.emit('next_Etest');//告訴電腦端可以下一題
            socket.emit('eye-user-answer', {'eye_user_answer': answer}); // 發送使用者的答案
            startDetection();
        });

        // 重新作答按鈕事件，重置狀態
        document.getElementById('retry-btn').addEventListener('click', function() {
            startDetection();
        });

        // 重置狀態以等待新一輪偵測
        function resetState() {
            currentDirection = '';
            document.getElementById('countdown-text').textContent = '';
            document.getElementById('confirm-btn').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'none';
        }

        // 接收測驗結束事件
        socket.on('Etest_finish', function() {
            var newUrl = window.location.origin + '/finish?session=' + location.href.split('=').pop();
            window.location.href = newUrl;
        });
    </script>
</body>
</html>
