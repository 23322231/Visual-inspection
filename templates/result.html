<!-- 色覺障礙測驗的結果頁面 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測驗結果</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #e0f7fa;
            font-family: 'Arial', sans-serif;
            color: #333;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 800px; /* 增加寬度來容納更多圖片 */
            width: 100%;
        }

        #imagesContainer {
            display: flex;
            flex-wrap: wrap; /* 允許圖片換行排列 */
            justify-content: center; /* 讓圖片水平居中 */
            gap: 10px; /* 圖片之間的間距 */
            margin-top: 20px;
        }

        #imagesContainer img {
            width: calc(25% - 10px); /* 讓每張圖片佔據容器寬度的 25% 減去間距 */
            height: auto; /* 保持圖片的等比例縮放 */
            object-fit: cover; /* 如果需要裁剪，可以使用 cover，否則使用 contain */
            border-radius: 10px; /* 給圖片增加圓角 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 增加陰影效果 */
            transition: transform 0.2s ease-in-out;
        }

        #imagesContainer img:hover {
            transform: scale(1.05); /* 滑過時略微放大圖片 */
        }

        #advice {
            margin-top: 30px;
            padding: 15px;
            background-color: #fff9e6;
            color: #8a6d3b;
            font-size: 1.1rem;
            border: 1px solid #faebcc;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            color: #fff;
            background-color: #00796b;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #004d40;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>測驗結果</h1>
        <p id="scoreDisplay">分數: 計算中...</p> <!-- 用來顯示分數 -->
        <div id="imagesContainer"></div>
    </div>
    <div id="advice" class="result">醫囑將顯示在這裡...</div>

    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script>
        var socket = io.connect('http://192.168.1.121:5000', {
            pingInterval: 25000, // 25 seconds
            pingTimeout: 60000,  // 60 seconds
        });
    </script>
    <script>
        let score;
        // 頁面載入完成後初始化
        window.onload = function() {

            var user_id = location.href.split('=').pop();
            fetch('/calculate-score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 'user_id': user_id })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    console.error('Error:', data.error);
                } else {
                    console.log('Score:', data.score);
                    // Display the score on the frontend
                    document.getElementById('scoreDisplay').innerText = `Score: ${data.score}`;
                }
            })
            .catch((error) => {
                console.error('Error:', error);
            });
            
            const imagesContainer = document.getElementById('imagesContainer');
            if (!imagesContainer) {
                console.error('Element with ID "imagesContainer" not found in the DOM.');
                return;  //退出，以避免調用null對象的appendChild
            }
            
            for (var i = 1; i <= 10; i++) {
                fetch('/result_cb', {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({'user_id': user_id,"index": i})
                })
                .then(response => {
                    if (!response.ok) {
                        // 打印具體的 HTTP 錯誤狀態碼
                        console.error(`HTTP error! status: ${response.status}`);
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })

                .then(data => {
                if (data.image_url) {
                    // 創建並添加圖片元素
                    const img = document.createElement('img');
                    img.src = data.image_url;
                    imagesContainer.appendChild(img);
                } else {
                    // 處理找不到圖片的情況
                    console.error('Image not found:', data.error);
                }
                })
                .catch(error => {
                    console.error('Error fetching images:', error);
                });
            }
            fetchAdvice();
        };


        let symptoms ="這是一個石原氏色盲測驗的結果，我獲得"+score+"分"; // 取得使用者輸入的症狀描述
        // 清空之前的結果並顯示 "生成中..."
        const adviceDiv = document.getElementById('advice');
        adviceDiv.innerText = "生成中...";
        async function fetchAdvice() {
            try {
                // 發送 POST 請求到後端以生成醫囑
                const response = await fetch('/generate-doctor-advice', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ symptoms }) // 將症狀描述傳遞到後端
                });

                if (!response.ok) {
                    throw new Error("發生錯誤，請重試。");
                }

                const data = await response.json();
                if (data.advice) {
                    adviceDiv.innerText = data.advice; // 顯示生成的醫囑
                } else {
                    adviceDiv.innerText = "未能生成醫囑。";
                }
            } catch (error) {
                adviceDiv.innerText = `錯誤：${error.message}`;
            }
        }
    </script>
</body>
</html>
