<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="static/css/eye_result.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測驗結果</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
            background: #ffffff;
            color: #333;
            line-height: 1.6;
            /*box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);*/
            border-radius: 10px;
        }
        /* Header */
        #header-bar {
            background-color: #444;
            color:#bbb;
            width: 100%;
            /* padding: 15px 10px; */
            position: fixed;
            cursor:default;
            top: 0;
            left: 0;
            z-index: 10000;
            height: 3.25em;
            line-height: 3.25em;
            font-family: 'Source Sans Pro', sans-serif;
            font-family: 'Source Sans Pro', sans-serif;
            /*text-align: left; /* 左對齊 */
            /* margin-bottom: 80px; */
        }
        #header-bar a {
            text-decoration: none;
            color: #bbb;
            font-size: 17.5px;
            /* font-weight: 100; */
            /* margin-right: 20px; */
            margin-left: 20.5px; /* 左邊微調間距 */
        }
        
        h2 {
            text-align: center;
            color: #af9d8f;
            margin-top:60px;
            margin-bottom: 20px;
            font-size: 2rem;
            font-weight: bold;
        }
        /* Grid container for question cards */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        /* Question card styling */
        .question {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            background-color: #fff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            text-align: center;
        }
        .question:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
        .question img {
            max-width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 8px;
        }
        .user-answer, .correct-answer {
            font-size: 0.9rem;
            padding: 8px;
            border-radius: 5px;
            margin: 6px 0;
            font-weight: 500;
        }
        .user-answer.correct {
            background-color: #d4edda;
            color: #155724;
        }
        .user-answer.incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }
        .correct-answer {
            background-color: #e2e3e5;
            color: #555;
        }
        #advice {
            margin-top: 30px;
            padding: 15px;
            background-color: #cbb7a8;
            color: #fefefe;
            font-size: 1.1rem;
            border: 1px solid #faebcc;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            margin-bottom: 100px;
        }

        .exit-button {
            /* margin-top: 30px; */
            margin-bottom: 130px;
            padding: 10px 20px;
            font-size: 1em;
            color: #999;
            background-color: #fefefe;
            border: 1.25px solid #999;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            align-items: center;
            text-align: center;
            display: flex;
        }

        .exit-button:hover {
            background-color: #e5e5e5;
        }

        /* CTA Section */
        #cta {
            /*background: #af9d8f;
            color: #efefef;
            padding: 2em 0;
            text-align: center;
            width: 100%;
            margin-top: auto;*/ /* 將 CTA 區塊推到底部 */

            background: #af9d8f;
            color: #efefef;
            padding: 2em 0;
            text-align: center;
            width: 100%;
            position: fixed; /* 固定位置 */
            bottom: 0; /* 置於底部 */
            left: 0;
            z-index: 10;
        }

        #cta ul {
            list-style: none;
            max-width: 800px;
            margin: 0 auto;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .question img {
                height: 80px;
            }
            .question {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Header section -->
    <div id="header-bar">
        <!-- <a href="index.html">Home</a> -->
        <a href="https://a99e-2001-b011-2003-fbb8-61c0-c59-2040-22f5.ngrok-free.app/quiz" style="float: left;">VisionCare</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

    <h2>測驗結果</h2>
    <div id="results" class="grid-container"></div>
    <div id="advice" class="result">醫囑將顯示在這裡...</div>
    <script>
        var socket = io.connect('https://a99e-2001-b011-2003-fbb8-61c0-c59-2040-22f5.ngrok-free.app');
        let answer = [];
        let correct = [];
        let numberOftest = 0;
        var degree = 5;
        var degree_end = 5;
        var symptoms = "";

        var uuid = location.href.split('=').pop();

        function fetchTestResults() {
            const storedDataString = localStorage.getItem('combinedArrays');
            const storedData = JSON.parse(storedDataString);

            answer = storedData['answer'];
            correct = storedData['correct'];
            numberOftest = storedData['numberOftest'];
            degree = storedData['degree'];
            degree=Math.round(degree*10)/10;
            degree_end=String(degree);
            console.log(degree_end)
            console.log(typeof degree_end)
            symptoms ="這是一個E字視力檢查的結果，不是石原色盲測試，我的E字視力檢查結果為"+String(degree_end)+"，其中0.1表示視力非常差，1.5表示視力極好"; // 取得使用者輸入的症狀描述


            renderResults();
        }

        function generateQuizResults() {
            if (!answer || !Array.isArray(answer)) {
                console.error("Etest_ans is null or not an array");
                return [];
            }

            let index = 0;
            return answer.map((number) => {
                let answerWord = '';
                let userAns = '';

                if (number == 0) answerWord = 'up';
                else if (number == 1) answerWord = 'down';
                else if (number == 2) answerWord = 'left';
                else if (number == 3) answerWord = 'right';

                if (correct[index] == 0) userAns = 'up';
                else if (correct[index] == 1) userAns = 'down';
                else if (correct[index] == 2) userAns = 'left';
                else if (correct[index] == 3) userAns = 'right';
                else if (correct[index] == 4) userAns = 'skip';

                const questionResult = {
                    questionText: `問題 ${index + 1}`,
                    imageUrl: `static/e_chart/${answerWord}.jpg`,
                    correctAnswer: answerWord,
                    userAnswer: userAns
                };
                index++;
                return questionResult;
            });
        }

        function renderResults() {
            const resultsContainer = document.getElementById('results');
            const results = generateQuizResults();

            results.forEach((result, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.classList.add('question');

                const img = document.createElement('img');
                img.src = result.imageUrl;
                img.alt = `問題 ${index + 1}`;
                questionDiv.appendChild(img);

                const questionText = document.createElement('p');
                questionText.classList.add('question-text');
                questionText.textContent = `${index + 1}. ${result.questionText}`;
                questionDiv.appendChild(questionText);

                const userAnswerDiv = document.createElement('div');
                userAnswerDiv.classList.add('user-answer');
                userAnswerDiv.textContent = `你的答案：${result.userAnswer}`;
                userAnswerDiv.classList.add(
                    result.userAnswer === result.correctAnswer ? 'correct' : 'incorrect'
                );
                questionDiv.appendChild(userAnswerDiv);

                const correctAnswerDiv = document.createElement('div');
                correctAnswerDiv.classList.add('correct-answer');
                correctAnswerDiv.textContent = `正確答案：${result.correctAnswer}`;
                questionDiv.appendChild(correctAnswerDiv);

                resultsContainer.appendChild(questionDiv);
            });
        }

        // 清空之前的結果並顯示 "生成中..."
        const adviceDiv = document.getElementById('advice');
        adviceDiv.innerText = "生成中...";
        async function fetchAdvice() {
            try {
                // 發送 POST 請求到後端以生成醫囑
                const response = await fetch('/generate-doctor-advice', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ symptoms }) // 將症狀描述傳遞到後端
                });

                if (!response.ok) {
                    throw new Error("發生錯誤，請重試。");
                }

                const data = await response.json();
                if (data.advice) {
                    adviceDiv.innerText = data.advice; // 顯示生成的醫囑
                } else {
                    adviceDiv.innerText = "未能生成醫囑。";
                }
            } catch (error) {
                adviceDiv.innerText = `錯誤：${error.message}`;
            }
        }

        socket.on('connect', () => console.log('WebSocket 已連接！'));
        socket.on('disconnect', () => console.log('WebSocket 已斷開連接！'));

        window.onload = ()=> {
            fetchTestResults();
            fetchAdvice();
        }

        // 關閉頁面或返回主頁
        function closePage() {
            if (window.confirm("確定要離開此頁面嗎？")) {
                // window.close(); // 嘗試關閉當前頁面
                window.location.href = window.location.origin + '/quiz';
            }
        }
    </script>
    <div align="center"><button class="exit-button" onclick="closePage()">離開</button></div>
    <section id="cta">
        <ul>
            <li>*免責聲明：有關近視的建議和進一步資訊，請諮詢您的視力保健專業人員。本系統之視覺模擬器僅供參考，不代表建議。</li>
        </ul>
    </section>
    
</body>
</html>
