<!-- 正式版: 圖片測驗 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片測驗</title>
    <style>
        /* Header */
        #header-bar {
            background-color: #444;
            width: 100%;
            padding: 15px 10px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 15;
            text-align: left; /* 左對齊 */
            /* margin-bottom: 80px; */
        }
        #header-bar a {
            text-decoration: none;
            color: #ffffff;
            font-size: 17px;
            font-weight: 200;
            margin-right: 20px;
            margin-left: 10px; /* 左邊微調間距 */
        }
        .image-test-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-image {
            width: 450px;
            height: 300px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-top: 100px; /* 調整圖片位置，避免與題數重疊 */
            margin-bottom: 20px;
            /* margin-top: 80px; 增加margin-top讓出空間給question-status */
        }
        .small-images {
            display: flex;
            justify-content: center;  /* 水平置中 */
            width: 80%;
        }
        .small-image-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .small-image {
            width: 300px;
            height: 200px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin: 5px;
            cursor: pointer;
            border: 2px solid transparent;
            margin-bottom: 20px;
        }
        .small-image.selected { /* 選擇圖片的方框 */
            border-color: #e67e5f;  
        }
        button {
            padding: 15px 30px; /* 增加按鈕內邊距 */
            font-size: 18px; /* 增加按鈕字體大小 */
            color: #fff;
            background-color: #af9d8f;
            border: none;
            border-radius: 6px; /* 較方的按鈕 */
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* 按鈕陰影加強 */
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .question-status {
            margin-top: 25px;
            font-size: 24px;
            font-weight: bold;
            color: #af9d8f; /* 文字顏色清晰 */
            text-align: center;
            position: absolute;
            top: 30px; /* 調整至更靠近頁面頂部的位置 */
            left: 50%;
            transform: translateX(-50%);
            z-index: 14; /* 確保在圖片上層 */
            
            padding: 5px 15px;
            
        }
        /* CTA Section */
        #cta {
            background: #af9d8f;
            color: #efefef;
            position: fixed;
            bottom: -10px;
            left: 0;
            width: 100%;
            text-align: left; /* 左對齊 */
            padding: 20px;
            box-sizing: border-box;
            z-index: 5;
        }
        #cta ul {
            list-style: none;
            margin: 0 auto;
            padding: 0;
            font-size: 14px;
            line-height: 1.6;
            max-width: 800px;
        }
        /* 調整在小螢幕下的顯示方式 */
        @media screen and (max-width: 768px) {
            .main-image {
                width: 80%;
                height: auto;
                aspect-ratio: 3 / 2; /* 保持圖片比例 */
                margin-bottom: 10px;
            }
            .small-images {
                flex-direction: column; /* 改成垂直排列 */
                width: 100%; /* 滿版寬度 */
            }
            .small-image-container {
                width: 100%; /* 保持滿版寬度 */
                margin: 5px 0; /* 增加間距 */
                text-align: center; /* 中心對齊 */
            }
            .small-image {
                width: 80%; /* 增加寬度，讓圖片在窄螢幕上更清晰 */
                height: auto;
                flex-direction: column;
                align-items: center; /* 確保按鈕在中間 */
                aspect-ratio: 3 / 2; /* 保持圖片比例 */
            }
            button {
                width: 80%;
                padding: 10px;
                font-size: 16px;
                margin-top: 20px;
            }
            .question-status {
                font-size: 20px;
            }
        }

        /* 超小螢幕的調整 */
        @media screen and (max-width: 480px) {
            .main-image {
                width: 100%;
                height: auto;
            }
            .small-image {
                width: 90%;
                height: auto;
                align-items: center; /* 確保按鈕在中間 */
            }
            .question-status {
                font-size: 18px;
            }
            button {
                font-size: 14px;
                padding: 10px;
            }
            #cta ul {
                font-size: 10px;
            }
            #cta {
                padding: 15px 10px;
            }
        }
    </style>
</head>
<body>
    <div>
        <!-- Header section -->
        <div id="header-bar">
            <!-- <a href="index.html">Home</a> -->
            <a href="index.html" style="float: left;">VisionCare</a>
        </div>

        <!-- Main -->
        <section id="main" class="container">

            <!-- 圖片測驗 -->
            <div class="image-test-container">
                <div class="question-status" id="questionStatus"></div> <!-- 顯示目前題數 -->
                <div class="main-image" id="mainImage"></div>
                <div class="small-images" id="smallImagesContainer">
                    <div class="small-image-container">
                        <div class="small-image" id="smallImage1" onclick="toggleSelection(0)"></div>
                        <div style="text-align:center;"><h4>選項 A</h4></div>
                    </div>
                    <div class="small-image-container">
                        <div class="small-image" id="smallImage2" onclick="toggleSelection(1)"></div>
                        <div style="text-align:center;"><h4>選項 B</h4></div>
                    </div>
                    <div class="small-image-container">
                        <div class="small-image" id="smallImage3" onclick="toggleSelection(2)"></div>
                        <div style="text-align:center;"><h4>選項 C</h4></div>
                    </div>
                    <div class="small-image-container">
                        <div class="small-image" id="smallImage4" onclick="toggleSelection(3)"></div>
                        <div style="text-align:center;"><h4>選項 D</h4></div>
                    </div>
                </div>
                <button onclick="nextQuestion()">下一題</button>

                <script>
                    // 定義圖片資料夾變數，可以隨時更改資料夾路徑
                    const imageFolder = '../static/cb_test_image/';
                    const mainImage = document.getElementById('mainImage');
                    const smallImages = [
                        document.getElementById('smallImage1'),
                        document.getElementById('smallImage2'),
                        document.getElementById('smallImage3'),
                        document.getElementById('smallImage4')
                    ];
        
                    const questionStatus = document.getElementById('questionStatus'); // 顯示題數的元素

                    // 定義所有 15 張 main 圖片名稱
                    const allImages = [
                        'colored_pencil.jpg',
                        'apple.jpg',
                        'rainbow.jpg',
                        'orange.jpg',
                        'kiwi.jpg',
                        'hot_air_balloon.jpg',
                        'beef.jpg',
                        'watermelon.jpg',
                        'book.jpg',
                        'christmas.jpg',                        
                        'car.jpg',
                        'house.jpg',
                        'clothes.jpg',
                        'sky.jpg',
                        'traffic_light2.jpg',
                    ];

                    // 根據每個 main 圖片生成對應的_pro、_deu、_tri
                    function generateQuestions(images) {
                        return images.map(main => ({
                            main: main,
                            small: [
                                main.replace('.jpg', '_pro.jpg'),
                                main.replace('.jpg', '_deu.jpg'),
                                main.replace('.jpg', '_tri.jpg'),
                                main
                            ]
                        }));
                    }

                    // 隨機選擇 10 張圖片
                    function getRandomQuestions() {
                        const shuffledImages = allImages.sort(() => 0.5 - Math.random()); // 隨機打亂所有圖片
                        const selectedImages = shuffledImages.slice(0, 10); // 取前 10 張
                        return generateQuestions(selectedImages); // 生成對應的 question 物件
                    }

                    // 生成 10 道題目的 questions 陣列
                    const questions = getRandomQuestions();
        
                    let currentQuestionIndex = 0;
                    let selectedOptions = [];
                    let correctCount = 0;
                    let redGreenColorBlindCount = 0;
                    let blueColorBlindCount = 0;
                    let otherCount = 0;
                    
                    // 設定主圖片
                    function setMainImage(imageFileName) {
                        const imageUrl = `${imageFolder}${imageFileName}`;
                        mainImage.style.backgroundImage = `url("${imageUrl}")`;
                    }

                    // 隨機排序小圖片
                    function shuffleImages(smallImageFiles) {
                        const shuffledFiles = smallImageFiles.sort(() => Math.random() - 0.5);
                        smallImages.forEach((image, index) => {
                            const imageUrl = `${imageFolder}${shuffledFiles[index]}`;
                            image.style.backgroundImage = `url("${imageUrl}")`;
                            image.dataset.image = imageUrl;
                        });
                    }
                    
                    // 目前測驗題數
                    function updateQuestionStatus() {
                        const completedQuestions = currentQuestionIndex + 1;
                        const remainingQuestions = questions.length - completedQuestions;
                        questionStatus.textContent = `第 ${completedQuestions} 題`;
                    }
                    
                    // 判斷使用者選擇的圖片和記錄每種類型(正常、紅綠色覺障礙、藍色色覺障礙、無法判斷)的數量
                    function evaluateAnswer() {
                        let hasRedGreen = false;
                        let hasBlue = false;
                        let hasCorrect = false;
        
                        selectedOptions.forEach(option => {
                            if (!option.includes('_pro') && !option.includes('_deu') && !option.includes('_tri')) {
                                hasCorrect = true;
                            }
                            else if ((option.includes('_pro') || option.includes('_deu')) && !option.includes('_tri')) {
                                hasRedGreen = true;
                            }
                            else if (option.includes('_tri') && !option.includes('_pro') && !option.includes('_deu')) {
                                hasBlue = true;
                            }
                        });
        
                        if (hasCorrect && !hasRedGreen && !hasBlue) {
                            correctCount++;
                        } else if (hasRedGreen) {
                            redGreenColorBlindCount++;
                        } else if (hasBlue) {
                            blueColorBlindCount++;
                        } else {
                            otherCount++;
                        }
                    }
                    
                    // 進入下一題
                    function nextQuestion() {
                        // console.log('選擇的圖片:', selectedOptions);
                        evaluateAnswer();
                        selectedOptions = [];
                        if (currentQuestionIndex < questions.length - 1) {
                            currentQuestionIndex++;
                            smallImages.forEach(image => image.classList.remove('selected'));
                            const nextQuestion = questions[currentQuestionIndex];
                            setMainImage(nextQuestion.main);
                            shuffleImages(nextQuestion.small);
                            updateQuestionStatus(); // 更新題數顯示
                        } else {
                            alert('最後一題 確定結束測驗');
                            showResult();
                        }
                    }

                    // 顯示測驗結果內容
                    function showResult() {
                        let resultMessage = `答對題數: ${correctCount} / 10 題\n`;
        
                        if (correctCount > redGreenColorBlindCount && correctCount > blueColorBlindCount && correctCount > otherCount && correctCount >= 6) {
                            resultMessage += "色覺障礙測驗結果為正常";
                        }else if (otherCount > redGreenColorBlindCount && otherCount > blueColorBlindCount) {
                            resultMessage += "無法判斷具體色覺障礙類型";
                        }else if (redGreenColorBlindCount > blueColorBlindCount) {
                            resultMessage += "有可能為紅色或綠色色覺障礙";
                        } else if (blueColorBlindCount > redGreenColorBlindCount) {
                            resultMessage += "有可能為藍色色覺障礙";
                        }

                        // 儲存結果到localStorage
                        localStorage.setItem('resultMessage', resultMessage);
                        // 開啟結果頁面
                        window.open("image_test_result", "_self");
                    }
                    
                    // 選擇圖片
                    function toggleSelection(index) {
                        
                        // 清除所有選項的選取狀態
                        smallImages.forEach(image => image.classList.remove('selected'));
                        selectedOptions = [];

                        const image = smallImages[index];
                        const imageUrl = image.dataset.image;
                        if (selectedOptions.includes(imageUrl)) {
                            selectedOptions = selectedOptions.filter(option => option !== imageUrl);
                            image.classList.remove('selected');
                        } else {
                            selectedOptions.push(imageUrl);
                            image.classList.add('selected');
                        }
                    }
                    
                    // 初始化測驗
                    function initialize() {
                        const firstQuestion = questions[0];
                        setMainImage(firstQuestion.main);
                        shuffleImages(firstQuestion.small);
                        updateQuestionStatus(); // 初始化時顯示題數
                        //console.log("初始化 questionStatus:", questionStatus);

                    }
        
                    initialize();
                </script>

            </div>
        </section>

        <!-- CTA section -->

            </ul>
        </section> -->

    </div>
